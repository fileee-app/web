# Postgres, and local S3, for development and tests. Connect S3 in settings with endpoint http://localhost:9000,
# bucket fileee, access key minioadmin and secret minioadmin. The official MinIO images are no longer
# published publicly, so this uses Chainguard's build.
services:
  postgres:
    image: postgres:18

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: fileee
      POSTGRES_PASSWORD: fileee
      POSTGRES_DB: fileee

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fileee", "-d", "fileee"]
      interval: 2s
      timeout: 5s
      retries: 30

    volumes:
      - postgres-data:/var/lib/postgresql

  # A top-level directory is a bucket to MinIO, so this creates "fileee" without needing mc.
  minio-init:
    image: alpine:3
    command: sh -c 'mkdir -p /data/fileee && chmod -R 777 /data'

    volumes:
      - minio-data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001

    depends_on:
      minio-init:
        condition: service_completed_successfully

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MinIO has no per-bucket CORS rules; this is its server-wide equivalent.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"

    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
