name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Without this the API tests that need S3 are skipped.
      S3_TEST_ENDPOINT: http://localhost:9000

    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Compose rather than job services, which can't pass MinIO its server command.
      - run: docker compose -f docker-compose.dev.yml up -d --wait postgres minio

      - name: Wait for MinIO
        run: timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      - run: pnpm test
