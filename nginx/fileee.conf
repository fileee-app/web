# Example nginx site for fileee, running on the same host as the containers.
# Replace files.example.com with your domain. Setup steps are in apps/docs/src/content/docs/deploying.md.

server {
    listen 80;
    listen [::]:80;

    server_name files.example.com;

    return 301 https://$host$request_uri;
}

server {
    # On nginx 1.25.1 or newer you can replace "http2" here with "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name files.example.com;

    ssl_certificate /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;

    # Uploads and downloads go straight to the bucket, so nginx's default 1 MB body limit is enough.

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Overwrites whatever the client sent, so nobody can fake their IP to dodge login rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
