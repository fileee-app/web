services:
  fileee:
    image: fileee
    build: .
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgres://fileee:${POSTGRES_PASSWORD:?openssl rand -hex 24}@postgres:5432/fileee
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?openssl rand -base64 32}

      # Only behind a reverse proxy that sets X-Forwarded-For.
      # TRUST_PROXY: "true"

      # Required until first-run setup is done: openssl rand -hex 16
      SETUP_TOKEN: ${SETUP_TOKEN:-}

  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: fileee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?openssl rand -hex 24}
      POSTGRES_DB: fileee

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fileee", "-d", "fileee"]
      interval: 5s
      timeout: 5s
      retries: 12

    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
